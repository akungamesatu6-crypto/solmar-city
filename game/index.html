<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harbor Heat — Solmar Bay</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230c121c'/%3E%3Ccircle cx='16' cy='13' r='6' fill='%23ffd21f'/%3E%3Crect x='4' y='21' width='24' height='4' rx='2' fill='%231f6f8b'/%3E%3C/svg%3E">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0c121c; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* HUD overlay never eats clicks: pointer events stay off so clicks reach the canvas (shoot). */
  #hud {
    position: fixed; inset: 0; pointer-events: none;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #f2f5f7;
  }
  .hud-top-left { position: fixed; top: 14px; left: 16px; }
  .hud-health {
    width: 220px; height: 14px; border-radius: 7px;
    background: rgba(10, 14, 20, 0.65); border: 1px solid rgba(255, 255, 255, 0.45);
    overflow: hidden;
  }
  .hud-health-fill { height: 100%; width: 100%; background: #37d67a; }
  .hud-cash {
    margin-top: 6px; font-size: 22px; font-weight: 800;
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
  }
  .hud-wanted {
    position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
    font-size: 30px; letter-spacing: 4px;
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.85);
  }
  .hud-bottom-left { position: fixed; left: 16px; bottom: 16px; max-width: 560px; }
  .hud-speed {
    font-size: 20px; font-weight: 800;
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
  }
  .hud-objective {
    margin-top: 4px; font-size: 15px; line-height: 1.35;
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.85);
  }
  .hud-timer {
    margin-top: 4px; font-size: 18px; font-weight: 800; color: #ffd21f;
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.85);
  }
  .hud-banner {
    position: fixed; top: 34%; left: 50%; transform: translate(-50%, -50%);
    max-width: 640px; text-align: center; font-size: 30px; font-weight: 800;
    line-height: 1.3; padding: 18px 28px; border-radius: 12px;
    background: rgba(10, 14, 20, 0.78); border: 2px solid rgba(255, 210, 31, 0.7);
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
  }
  .hud-title {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    background: linear-gradient(rgba(8, 12, 20, 0.15), rgba(8, 12, 20, 0.55));
  }
  .hud-title h1 {
    margin: 0; font-size: 76px; font-weight: 900; letter-spacing: 6px;
    color: #ffd21f; text-shadow: 0 4px 18px rgba(0, 0, 0, 0.9);
  }
  .hud-title .hud-subtitle {
    margin-top: 6px; font-size: 24px; font-weight: 600;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
  }
  .hud-title .hud-start {
    margin-top: 26px; font-size: 20px; font-weight: 700;
    padding: 10px 22px; border-radius: 999px;
    background: rgba(255, 210, 31, 0.92); color: #14100a;
  }
  .hud-title .hud-controls {
    margin-top: 18px; font-size: 15px; line-height: 1.6; color: #e8eef4;
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
  }
  #minimap {
    position: fixed; right: 16px; bottom: 16px; width: 180px; height: 180px;
    border: 2px solid rgba(255, 255, 255, 0.35); border-radius: 8px;
    background: rgba(12, 18, 28, 0.72);
  }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="game" aria-label="Harbor Heat: drive and deliver around Solmar Bay"></canvas>
<div id="hud"></div>
<canvas id="minimap" width="180" height="180" aria-label="Minimap of Solmar Bay"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
